# Local dev helpers only — MongoDB runs on Atlas (see MONGO_URL in .env).
# Redis is optional; the API falls back to inline job processing when Redis is down.
services:
  redis:
    image: redis:7
    ports:
      # Host port only. Set REDIS_HOST_PORT when 6379 is already taken.
      - "${REDIS_HOST_PORT:-6379}:6379"
    volumes:
      - redis-data:/data

volumes:
  redis-data:
